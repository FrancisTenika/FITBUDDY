<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitBuddy API</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #1e293b;
      padding: 2rem 3rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    h1 {
      color: #38bdf8;
    }

    code {
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      color: #facc15;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>💪 FitBuddy Backend</h1>
    <p>The API is live and running.</p>
    <p>Health check: <code>/api/health</code></p>
    <p>Auth: <code>/api/auth/register</code> · <code>/api/auth/login</code></p>
    <p>Workouts: <code>/api/workouts</code></p>
  </div>
</body>

</html>
